name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # No continue-on-error on any leg. Windows carried one from the day it
    # joined the matrix — "not yet triaged" rather than "broken" — and it
    # earned three releases' worth of invisible red: 28 failing tests, two of
    # them real Windows bugs, and a first run on a native machine that showed
    # them. They are triaged and green as of run 34089952400, so the exemption
    # is gone and a red Windows leg blocks a merge like any other.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run compile

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Green on Windows since it joined, and it is now the only test that
    # exercises a native Windows path end to end — the workbench hands the
    # extension a backslashed drive-lettered folder, a project is made from it
    # and read back out of the store. It blocks a merge.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      # The VS Code download is ~150 MB per OS. Cached on the lockfile, which
      # is what pins @vscode/test-electron and therefore which build it fetches.
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: xvfb-run -a npm run test:smoke
        if: runner.os == 'Linux'
      - run: npm run test:smoke
        if: runner.os != 'Linux'
