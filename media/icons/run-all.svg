<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img"
     fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <title>Sub-agents working</title>
  <!-- WORK THAT HAS FANNED OUT: one stem, three rails, each ending in a play
       head. It is read at about 12px beside a name, so it is four strokes and
       three small triangles and nothing else.
       The triangles are FILLED while the rails are stroked, which is the only
       contrast that survives being turned into a CSS mask: a mask reads alpha
       only, so filled and stroked are the two weights available.
       The rails stop at x=8.8 and the heads start at x=9.2, which under a 1.4
       round cap (reaching to 9.5) is a small deliberate overlap. A visible gap
       there reads as two unrelated marks rather than one fan-out.
       NB. no double hyphen anywhere in this comment. An svg used as a CSS mask
       is parsed as strict XML, where a comment containing one is a fatal error
       and the whole file renders as nothing. -->
  <path d="M3.4 3.2v9.6"/>
  <path d="M3.4 3.2H8.8"/>
  <path d="M3.4 8H8.8"/>
  <path d="M3.4 12.8H8.8"/>
  <path d="M9.2 1.9L13.1 3.2L9.2 4.5Z" fill="#000" stroke-width="0.9"/>
  <path d="M9.2 6.7L13.1 8L9.2 9.3Z" fill="#000" stroke-width="0.9"/>
  <path d="M9.2 11.5L13.1 12.8L9.2 14.1Z" fill="#000" stroke-width="0.9"/>
</svg>
