<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img"
     fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <title>Draft pull request</title>
  <!-- The pull request, unfinished: the same two columns, and the right one
       stops in a short dash instead of an arrowhead. A draft is a request that
       is not asking anything of anybody yet, and a line that does not arrive
       anywhere is what that looks like.
       Not a dashed stroke down the whole line: at 11px a dash pattern reads as
       a dotted smudge, where one gap near the top survives.
       NB. no double hyphen anywhere in this comment. An svg used as a CSS mask
       is parsed as strict XML, where a comment containing one is a fatal error
       and the whole file renders as nothing. -->
  <circle cx="4.6" cy="3.8" r="1.9"/>
  <circle cx="4.6" cy="12.2" r="1.9"/>
  <path d="M4.6 5.7v4.6"/>
  <circle cx="11.4" cy="12.2" r="1.9"/>
  <path d="M11.4 10.3V7.3"/>
  <path d="M11.4 5.1V4.5"/>
</svg>
