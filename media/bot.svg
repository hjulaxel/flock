<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <!-- Activity bar mark: an agent whose antenna forks in two.
       Outline weight on purpose — the activity bar draws an inactive container
       at ~40% opacity, and a solid mark at that opacity is a grey blob next to
       Explorer and Search. The workbench renders this as an alpha mask, so
       currentColor is inert and the theme supplies the colour. -->
  <path d="M12 6.3V4.6"/>
  <path d="M12 4.6 9.4 3.1"/>
  <path d="M12 4.6l2.6-1.5"/>
  <circle cx="8.7" cy="2.7" r="1" fill="currentColor" stroke="none"/>
  <circle cx="15.3" cy="2.7" r="1" fill="currentColor" stroke="none"/>
  <rect x="3.7" y="6.3" width="16.6" height="13.4" rx="4.5"/>
  <path d="M1.75 12v3.2"/>
  <path d="M22.25 12v3.2"/>
  <circle cx="8.9" cy="13" r="1.45" fill="currentColor" stroke="none"/>
  <circle cx="15.1" cy="13" r="1.45" fill="currentColor" stroke="none"/>
</svg>
