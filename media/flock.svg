<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Activity bar mark: three birds, after the pencil drawing the marketplace
       icon is made from (media/icon.png).
       This has to be a vector and it has to be monochrome — the workbench
       renders a view-container icon as an ALPHA MASK, so a photograph would
       arrive as a solid square and `currentColor` is inert; the theme supplies
       the colour. Three birds, not the drawing's five: at 24px the extra two
       collapse into the others and the flock reads as a smudge.
       Each wing pair is asymmetric — short leading wing, long trailing sweep —
       which is what stops a bird at this size reading as a checkmark. -->
  <path d="M2 9.1q2.6-.5 4.5 1.8Q9 7.7 13 7"/>
  <path d="M12.4 14q2.3-.5 4 1.6 2.2-2.7 5.6-3.3"/>
  <path d="M3.8 17.6q1.9-.4 3.2 1.3 1.7-2.2 4.3-2.7"/>
</svg>
